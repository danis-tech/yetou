<script>
  document.addEventListener('DOMContentLoaded', function() {
    const table = document.querySelector('#result_list');
    if (table && typeof DataTable !== 'undefined') {
      table.classList.add('display');
      new DataTable(table, {
        paging: false,
        searching: true,
        ordering: true,
        info: false,
        language: {
          url: 'https://cdn.datatables.net/plug-ins/2.0.8/i18n/fr-FR.json'
        },
      });
    }
  });
</script>
<script>
  /* Aperçu média (photo/vidéo) en modal, sans quitter l'interface admin */
  document.addEventListener('DOMContentLoaded', function() {
    const modal = document.createElement('div');
    modal.className = 'yetou-media-modal';
    modal.hidden = true;
    modal.innerHTML =
      '<div class="yetou-media-modal-backdrop"></div>' +
      '<div class="yetou-media-modal-dialog">' +
        '<button type="button" class="yetou-media-modal-close" aria-label="Fermer">&times;</button>' +
        '<div class="yetou-media-modal-title"></div>' +
        '<div class="yetou-media-modal-body"></div>' +
      '</div>';
    document.body.appendChild(modal);

    const bodyEl = modal.querySelector('.yetou-media-modal-body');
    const titleEl = modal.querySelector('.yetou-media-modal-title');

    function closeModal() {
      modal.hidden = true;
      bodyEl.innerHTML = '';
      document.body.classList.remove('yetou-modal-open');
    }

    function openModal(type, src, poster, title) {
      if (!src) return;
      bodyEl.innerHTML = '';
      titleEl.textContent = title || '';
      let el;
      if (type === 'video') {
        el = document.createElement('video');
        el.src = src;
        if (poster) el.poster = poster;
        el.controls = true;
        el.autoplay = true;
        el.preload = 'metadata';
      } else {
        el = document.createElement('img');
        el.src = src;
        el.alt = title || '';
      }
      bodyEl.appendChild(el);
      modal.hidden = false;
      document.body.classList.add('yetou-modal-open');
    }

    document.addEventListener('click', function(e) {
      const trigger = e.target.closest('.yetou-media-preview');
      if (trigger) {
        e.preventDefault();
        openModal(trigger.dataset.type, trigger.dataset.src, trigger.dataset.poster, trigger.dataset.title);
        return;
      }
      if (!modal.hidden && (e.target.closest('.yetou-media-modal-close') || e.target.classList.contains('yetou-media-modal-backdrop'))) {
        closeModal();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });
  });
</script>
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     THÈME CLAIR / SOMBRE
     Django 6 gère nativement 3 états sur <html data-theme="dark|light|auto">

  /* Corrections ponctuelles : certains composants natifs Django réutilisent
     une variable (ex. --header-link-color) à la fois pour le texte du header
     ET pour du texte blanc sur un fond orange (--primary) ; on force donc le
     blanc explicitement là où le fond reste toujours orange/marque, quel que
     soit le thème. */
  .object-tools a.addlink,
  .selector-chosen-title, .selector-chosen-title label,
  .selector-chosen .list-footer-display {
    color: #fff !important;
  }
  .calendar table { background: var(--body-bg); }
  .calendarbox, .clockbox { box-shadow: 0 12px 32px var(--shadow-color); }

  body { font-family: var(--font-family-primary); font-size: 13px; transition: background-color .15s, color .15s; }
  body.login { background: #0A0A0F !important; }

  #header {
    height: var(--header-height); background: var(--header-bg);
    border-bottom: 1px solid var(--border-color); color: var(--header-color);
  }
  #header h1 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; padding: 0 16px; }
  #header h1 em { color: var(--primary); font-style: normal; }
  #header h1 span { font-size: 10px; font-weight: 400; color: var(--body-quiet-color); margin-left: 6px; }

  #branding { float: left; }
  #user-tools { font-size: 11px; }
  #user-tools a { border-bottom: none; }
  #user-tools a:focus, #user-tools a:hover { color: var(--primary); }

  #header a:link, #header a:visited { color: var(--body-quiet-color); }
  #header a:hover { color: var(--primary); }

  .module h2, .module caption {
    background: var(--darkened-bg); color: var(--body-fg);
    font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border-color);
  }
  .module { border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 20px; background: var(--darkened-bg); }

  .breadcrumbs {
    background: var(--breadcrumbs-bg) !important; color: var(--breadcrumbs-fg) !important;
    font-size: 11px; padding: 8px 16px; border-bottom: 1px solid var(--border-color);
  }
  .breadcrumbs a { color: var(--body-quiet-color); }
  .breadcrumbs a:hover { color: var(--primary); }

  #content { padding: 20px; }
  #content h1 { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; color: var(--body-fg); }

  a:link, a:visited { color: var(--link-fg); }
  a:focus, a:hover { color: var(--link-hover-color); }

  input[type="text"], input[type="password"], input[type="email"], input[type="url"],
  input[type="number"], input[type="tel"], textarea, select {
    background: var(--input-bg); color: var(--input-fg); border: 1px solid var(--input-border);
    border-radius: 6px; padding: 8px 12px; font-size: 13px; font-family: inherit;
  }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px rgba(200,55,26,0.12); outline: none;
  }
  select { background: var(--input-bg); }
  select option { background: var(--darkened-bg); color: var(--body-fg); }

  .form-row { border-bottom: 1px solid var(--border-color); padding: 12px 0; }
  label { color: var(--body-fg); font-weight: 500; }

  input[type="submit"], button, .button {
    background: var(--button-bg); border: none; color: var(--button-fg);
    padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  input[type="submit"]:hover, button:hover, .button:hover,
  input[type="submit"]:focus, button:focus, .button:focus {
    background: var(--button-hover-bg);
  }
  .button.default { background: var(--default-button-bg); }
  .button.default:hover { background: var(--default-button-hover-bg); }

  .deletelink, .deletelink:link, .deletelink:visited {
    background: var(--delete-button-bg) !important; color: #fff !important;
    border-radius: 6px; padding: 6px 12px; font-size: 11px;
  }
  .deletelink:hover { background: var(--delete-button-hover-bg) !important; }

  .object-tools a.addlink { background: var(--primary); border-radius: 6px; padding: 6px 14px; }

  table { border-collapse: separate; border-spacing: 0; }
  thead th {
    background: var(--darkened-bg); color: var(--body-quiet-color);
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 10px 12px; border-bottom: 1px solid var(--border-color);
  }
  tbody td, tbody th {
    padding: 10px 12px; border-bottom: 1px solid var(--hairline-color);
    color: var(--body-fg); font-size: 12px;
  }
  tbody tr:hover { background: var(--selected-row); }
  #result_list tbody tr:last-child td { border-bottom: none; }

  .paginator {
    background: var(--darkened-bg); border-top: 1px solid var(--border-color);
    padding: 10px 12px; font-size: 11px;
  }
  .paginator a { border-radius: 6px; padding: 4px 10px; }
  .paginator a:hover { background: var(--primary); color: #fff; }

  .messagelist { padding: 0 20px; }
  .success { background: var(--message-success-bg); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; color: var(--body-fg); }
  .warning { background: var(--message-warning-bg); border: 1px solid rgba(255,179,0,0.2); border-radius: 8px; }
  .errornote { background: var(--message-error-bg); border: 1px solid rgba(200,55,26,0.2); border-radius: 8px; }

  /* ─── Page de connexion ─── */
  .login #header { display: none; }
  .login #footer { display: none; }

  body.login {
    background:
      radial-gradient(600px circle at 15% 20%, rgba(200,55,26,0.14), transparent 60%),
      radial-gradient(700px circle at 85% 85%, rgba(200,55,26,0.10), transparent 60%),
      #0A0A0F !important;
  }

  /* Neutralise tout fond/bordure hérité du thème clair/sombre natif de Django
     sur les conteneurs intermédiaires (seule la carte #content-main doit être visible). */
  .login #container,
  .login .main,
  .login main.content,
  .login #content {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }

  .login #container { min-width: 0; }

  /* #container > .main est étiré en hauteur par Django (base.css) : on centre
     le contenu à l'intérieur de ce bloc plutôt que sur #container lui-même. */
  .login .main,
  .login main.content {
    width: 100%;
  }
  .login main.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    /* Padding bas > padding haut : décale le centrage un peu vers le haut */
    padding: 6vh 20px 16vh;
    box-sizing: border-box;
  }

  .login #content-related { display: none; }

  .login #content {
    padding: 0;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  /* En-tête de marque au-dessus de la carte */
  .login-brand { text-align: center; margin-bottom: 28px; }
  .login-brand-title {
    font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 800;
    letter-spacing: -0.5px; color: #F0EFEA; margin: 0 0 6px;
  }
  .login-brand-title em { color: var(--primary); font-style: normal; }
  .login-brand-subtitle {
    font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--body-quiet-color); margin: 0;
  }

  .login #content-main {
    position: relative;
    float: none;
    box-sizing: border-box;
    width: 100%;
    background: linear-gradient(180deg, #16161D 0%, #101015 100%);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 38px 34px 32px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
    overflow: hidden;
  }
  .login #content-main::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), #e0663f, var(--primary));
  }

  .login #content-title { display: none; }

  .login form#login-form { display: flex; flex-direction: column; gap: 16px; }

  .login .form-row {
    border-bottom: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .login .form-row label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--body-quiet-color);
  }
  .login .form-row input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 14px;
    font-size: 13px;
    background: #0A0A0F;
    border: 1px solid var(--border-color);
    border-radius: 9px;
    transition: border-color .15s, box-shadow .15s;
  }
  .login .form-row input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(200,55,26,0.15);
    outline: none;
  }

  .login .password-reset-link { margin-top: -4px; text-align: right; }
  .login .password-reset-link a { font-size: 11px; color: var(--body-quiet-color); }
  .login .password-reset-link a:hover { color: var(--primary); }

  .login .errornote {
    margin-bottom: 18px; padding: 12px 14px; font-size: 12px; line-height: 1.5;
  }

  .login .submit-row {
    display: block;
    margin: 6px 0 0;
    padding: 0;
    background: none;
    border: none;
    border-radius: 0;
  }
  .login .submit-row input[type="submit"] {
    width: 100%;
    padding: 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), #A52D16);
    box-shadow: 0 8px 20px rgba(200,55,26,0.3);
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .login .submit-row input[type="submit"]:hover {
    background: linear-gradient(135deg, #e04528, var(--primary));
    box-shadow: 0 10px 24px rgba(200,55,26,0.4);
    transform: translateY(-1px);
  }
  .login .submit-row input[type="submit"]:active { transform: translateY(0); }

  /* Sidebar */
  #content-related {
    background: var(--darkened-bg); border: 1px solid var(--border-color);
    border-radius: 8px; padding: 16px; margin-right: 0;
  }
  #content-related h2 { font-family: 'Sora', sans-serif; font-size: 12px; }
  #content-related h3 { color: var(--body-fg); font-size: 12px; }

  /* Hide sidebar on main index */
  .dashboard #content-related { display: none; }
  .dashboard #content-main { margin-right: 0 !important; width: 100% !important; float: none !important; }
  /* Django limite le tableau de bord à 600px de large par défaut : on l'étend */
  .dashboard #content { width: 100% !important; max-width: none !important; }

  /* Liste des applications (Médias, Utilisateurs, ...) : colonne de navigation
     verticale unique, alignée dans la colonne gauche du tableau de bord */
  .dashboard #content-main.app-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .dashboard #content-main.app-list .module table {
    width: 100%;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--body-bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

  /* Remove unnecessary elements */
  #footer { display: none; }
  div.help, p.help, span.help { font-size: 11px; color: var(--body-quiet-color); }

  /* DataTables dark theme */
  .dt-container { font-family: var(--font-family-primary); }
  .dt-search input, .dt-length select {
    background: var(--input-bg) !important; color: var(--input-fg) !important;
    border: 1px solid var(--input-border) !important; border-radius: 6px !important;
    padding: 6px 10px !important; font-size: 12px !important;
  }
  .dt-search label, .dt-length label, .dt-info { color: var(--body-quiet-color) !important; font-size: 12px; }
  .dt-paging button {
    background: var(--darkened-bg) !important; color: var(--body-quiet-color) !important;
    border: 1px solid var(--border-color) !important; border-radius: 6px !important;
    font-size: 12px !important; padding: 4px 10px !important;
  }
  .dt-paging button:hover { background: var(--primary) !important; color: #fff !important; border-color: var(--primary) !important; }
  .dt-paging button.current { background: var(--primary) !important; color: #fff !important; border-color: var(--primary) !important; }
  .dt-paging button.disabled { opacity: 0.4; }

  /* Info tooltip */
  .field-info-tip {
    color: var(--body-quiet-color); font-size: 13px; cursor: help; margin-left: 4px;
    position: relative; display: inline-block; transition: color .15s;
  }
  .field-info-tip:hover { color: var(--primary); }
  .field-info-tip:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--card-bg); color: var(--body-fg); border: 1px solid var(--border-color);
    padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 400;
    white-space: normal; max-width: 360px; width: max-content;
    z-index: 9999; line-height: 1.5;
    box-shadow: 0 8px 30px var(--shadow-color); text-align: left;
    pointer-events: none;
  }

  /* Collapse - preserve Django native behavior */
  fieldset.module.collapse h2 { cursor: pointer; }
  fieldset.module.collapse.hidden-section { opacity: 0.25; pointer-events: none; }
  fieldset.module.collapse.hidden-section h2 { pointer-events: auto; }
  table.display thead th { cursor: pointer; }
  table.display thead th.dt-ordering-asc, table.display thead th.dt-ordering-desc {
    background: var(--primary) !important; color: #fff !important;
  }
  table.display thead th:hover { background: var(--selected-bg) !important; }

  /* Filtres latéraux */
  #changelist-filter {
    background: var(--darkened-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
  }
  #changelist-filter h2 {
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--body-quiet-color);
    margin-bottom: 8px;
  }
  #changelist-filter li { margin-bottom: 4px; }
  #changelist-filter a { color: var(--body-quiet-color); font-size: 12px; }
  #changelist-filter li.selected a { color: var(--primary); font-weight: 600; }
  .change-list .filtered .results,
  .change-list .filtered .paginator,
  .change-list .filtered #toolbar { margin-right: 280px; }

  /* ─── Formulaires : agencement des champs (fiche ajout/modification) ─── */
  fieldset.module { padding: 4px 24px 22px; }
  fieldset.module > h2,
  fieldset.module > details > summary > h2 {
    margin: 0 -24px 18px;
    padding: 14px 24px;
  }
  fieldset.module .description { padding: 12px 0 4px; color: var(--body-quiet-color); font-size: 12px; }

  .form-row { border-bottom: 1px solid var(--border-color); padding: 16px 0; }
  .form-row:last-child { border-bottom: none; }

  /* Ligne à plusieurs champs : grille régulière au lieu du flex par défaut (qui laisse de grands vides) */
  .flex-container.form-multiline {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px 28px;
    align-items: start;
  }
  .flex-container.form-multiline > .fieldBox {
    margin-right: 0;
    min-width: 0;
  }

  /* Chaque champ : libellé au-dessus, champ en dessous (plus lisible que libellé à gauche) */
  .form-row .flex-container,
  .flex-container.form-multiline > .fieldBox {
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .form-row .flex-container.checkbox-row {
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }

  .aligned label, .aligned legend {
    display: block;
    float: none;
    width: auto;
    min-width: 0;
    padding: 0 0 7px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--body-quiet-color);
  }
  .aligned .vCheckboxLabel {
    text-transform: none; font-size: 13px; font-weight: 500; color: var(--body-fg);
    padding: 0 0 0 8px;
  }

  form .aligned ul { margin-left: 0; padding-left: 0; }
  form .aligned div.radiolist { margin: 0; padding: 0; }

  form .aligned p.help, form .aligned div.help,
  form .aligned input + p.help, form .aligned textarea + p.help, form .aligned select + p.help,
  form .aligned input + div.help, form .aligned textarea + div.help, form .aligned select + div.help {
    margin: 8px 0 0 !important;
    padding: 0 !important;
    font-size: 11px;
    line-height: 1.5;
  }

  .vTextField, .vUUIDField, .vURLField, .vIntegerField, .vBigIntegerField,
  .vDateField, .vTimeField, select:not([multiple]) {
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
  }
  .vLargeTextField, .vXMLLargeTextField, textarea {
    width: 100% !important;
    max-width: 100%;
    box-sizing: border-box;
    min-height: 90px;
  }

  /* ─── Barre d'actions (boutons Enregistrer / Supprimer) ─── */
  .submit-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    background: var(--darkened-bg); border: 1px solid var(--border-color);
    border-radius: 10px; padding: 14px 18px; margin: 0 0 24px;
  }
  .submit-row input[type="submit"] { margin: 0; }
  .submit-row input[name="_save"] {
    order: -1;
    font-weight: 700;
    padding: 9px 22px;
  }
  .submit-row input[name="_addanother"],
  .submit-row input[name="_continue"] {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--body-fg);
  }
  .submit-row input[name="_addanother"]:hover,
  .submit-row input[name="_continue"]:hover {
    border-color: var(--primary); color: var(--primary); background: rgba(200,55,26,0.08);
  }
  .submit-row p.deletelink-box,
  .submit-row .deletelink-box {
    margin-left: auto; margin-top: 0;
  }

  .object-tools { margin: 0 0 16px; text-align: right; }
  .object-tools a { border-radius: 6px; }

  /* ─── Barre latérale : liste des applications ─── */
  #nav-sidebar { background: var(--body-bg); padding-top: 8px; }
  #nav-sidebar .module { margin: 0 12px 16px; background: transparent; border: none; }
  #nav-sidebar caption, #nav-sidebar .module h2 {
    background: transparent; border: none; color: var(--body-quiet-color);
    font-size: 10px; letter-spacing: 0.6px; padding: 6px 8px;
  }
  #nav-sidebar table { width: 100%; border-collapse: collapse; }
  #nav-sidebar th, #nav-sidebar td {
    padding: 6px 8px !important; border: none !important; background: transparent !important;
  }
  #nav-sidebar tr:hover th, #nav-sidebar tr:hover td {
    background: var(--darkened-bg) !important; border-radius: 6px;
  }
  #nav-sidebar .addlink { color: var(--primary) !important; font-size: 11px; }
  #nav-filter {
    border-radius: 8px; padding: 8px 12px; margin: 12px; width: calc(100% - 24px);
    box-sizing: border-box;
  }

  /* ─── Modal aperçu média (photo / vidéo) ─── */
  body.yetou-modal-open { overflow: hidden; }
  .yetou-media-modal { position: fixed; inset: 0; z-index: 10000; }
  .yetou-media-modal[hidden] { display: none; }
  .yetou-media-modal-backdrop {
    position: absolute; inset: 0; background: rgba(5,5,8,0.85); backdrop-filter: blur(3px);
  }
  .yetou-media-modal-dialog {
    position: relative; max-width: min(90vw, 900px); max-height: 90vh; margin: 5vh auto;
    background: var(--darkened-bg); border: 1px solid var(--border-color); border-radius: 12px;
    padding: 16px; box-shadow: 0 25px 60px rgba(0,0,0,0.55);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .yetou-media-modal-title {
    align-self: flex-start; color: var(--body-fg); font-family: 'Sora', sans-serif;
    font-size: 13px; font-weight: 600; padding-right: 30px;
  }
  .yetou-media-modal-body { display: flex; align-items: center; justify-content: center; width: 100%; }
  .yetou-media-modal-body img, .yetou-media-modal-body video {
    max-width: 100%; max-height: 78vh; border-radius: 8px; display: block; background: #000;
  }
  .yetou-media-modal-close {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--close-button-bg); color: var(--body-fg); border: none; cursor: pointer;
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .yetou-media-modal-close:hover { background: var(--primary); color: #fff; }
</style>
{% endblock %}
